name: flyball
description: "Football trivia mini-games, Dark-Mode Neo-Brutalist, AI-powered."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared catalogue + AI engine (club/country data, Gemini prompts & parsing,
  # board/round generation) — also used by `backend/`.
  flyball_core:
    path: ../packages/flyball_core

  # High-performance micro-animations and spring physics
  flutter_animate: ^4.5.0

  # Modern sleek fonts for premium UI
  google_fonts: ^6.2.1

  # HTTP client: talks to the Flyball backend (and, in "direct" mode, Gemini).
  http: ^1.2.2

  # Locale-aware date/plural formatting for the generated localizations.
  intl: ^0.20.2

  # Dynamic club/league/trophy art (TheSportsDB) + flags (flagcdn): disk+memory
  # cached network images so a spin never re-fetches art it already has.
  cached_network_image: ^3.4.1

  # Small per-viewer persistence: language choice, and a short-lived local
  # cache of resolved art URLs and AI answers (NOT a player database — there
  # is none; every answer comes from a live/cached AI search).
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/flyball_app_logo.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  generate: true # runs `flutter gen-l10n` from lib/l10n/*.arb (see l10n.yaml)
  uses-material-design: true

  # Only the app/launcher logo is a bundled asset — every club logo, league
  # badge, trophy and flag is fetched dynamically (TheSportsDB / flagcdn) and
  # disk-cached, so the club/country pool can grow without adding images here.
  assets:
    - assets/images/flyball_app_logo.png
